*{box-sizing:border-box}html,body{margin:0;background:#101827;color:#fff;font-family:Georgia,serif}body{min-height:100vh}.app{max-width:1180px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}h1{margin:0;color:#fff3d2;font-size:clamp(22px,4vw,36px)}.sub{font:13px Arial;color:#cbd5e1;margin-top:3px}.buttons{display:flex;gap:7px;flex-wrap:wrap}button{min-height:44px;padding:10px 13px;border-radius:12px;border:1px solid #4b5563;background:#263449;color:#fff;font:700 14px Arial;cursor:pointer}.primary{background:#8b2f2f;border-color:#b34a4a}.page{position:relative;aspect-ratio:16/9;overflow:hidden;background:#000;border-radius:17px;box-shadow:0 18px 50px #0008;perspective:1500px}.page.flipN{animation:flipN .56s ease}.page.flipP{animation:flipP .56s ease}@keyframes flipN{45%{transform:rotateY(-9deg) scale(.987)}55%{transform:rotateY(7deg) scale(.987)}}@keyframes flipP{45%{transform:rotateY(9deg) scale(.987)}55%{transform:rotateY(-7deg) scale(.987)}}img{width:100%;height:100%;object-fit:cover;display:block}.shade{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.86));pointer-events:none}.caption{position:absolute;left:clamp(10px,3vw,30px);right:clamp(10px,3vw,30px);bottom:clamp(10px,2.4vw,24px);background:rgba(255,250,240,.95);color:#222;padding:clamp(11px,2vw,18px);border-radius:14px;border-left:6px solid #d7a63a}.caption h2{margin:0 0 7px;color:#622626;font-size:clamp(19px,3vw,34px)}.caption p{margin:0;font-size:clamp(13px,1.8vw,19px);line-height:1.35}.quotes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.quote{font:italic 600 clamp(11px,1.4vw,14px) Georgia;background:#fff1c1;border:1px solid #e3c96c;padding:6px 9px;border-radius:999px}.count{position:absolute;top:10px;right:10px;background:#0009;padding:6px 9px;border-radius:999px;font:700 12px Arial}.tap{position:absolute;top:0;bottom:0;width:25%;border:0;background:transparent;z-index:2}.left{left </style></head><body><main class="app"><div class="top"><div><h1>Moses and the Red Sea</h1><div class="sub">Interactive illustrated storybook • Exodus 13–14 • natural multi-voice edition</div></div><div class="buttons"><button class="primary" id="read">🔊 Read Page</button><button id="full">▶ Read Full Story</button><button id="stop">■ Stop</button></div></div><section class="page" id="page"><img id="img" alt=""><div class="shade"></div><button class="tap left" id="left" aria-label="Previous page"></button><button class="tap right" id="right" aria-label="Next page"></button><div class="count" id="count"></div><article class="caption"><h2 id="title"></h2><p id="text"></p><div class="quotes" id="quotes"></div></article></section><div class="progress"><div class="bar" id="bar"></div></div><div class="nav"><button class="prev" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="next" id="next">Next →</button></div><div class="opts"><label><input type="checkbox" id="aut" checked> Auto-read after flip</label><label><input type="checkbox" id="flip" checked> Flip sound</label><label><input type="checkbox" id="fx" checked> Scene effects</label><span class="status" id="status">Tap Read Page once to start audio.</span></div><p class="help">Works in current Chrome, Safari, Edge, Firefox, Android, iPhone, iPad, Windows and macOS. Mobile browsers require the first audio playback to begin from a tap.</p><audio id="audio" preload="auto" playsinline></audio></main><script>
const pages=[{"title": "Escape from Egypt", "text": "After many years of slavery in Egypt, the Israelites were finally free. Moses led them away from Egypt toward the land God had promised them.", "dialogues": [], "fx": "desert", "image": "assets/images/scene01.webp", "audio": "assets/audio/page01.mp3"}, {"title": "Pharaoh Changes His Mind", "text": "But Pharaoh changed his mind. He sent his army and chariots after the Israelites.", "dialogues": ["Prepare the chariots! Bring them back!"], "fx": "hooves", "image": "assets/images/scene02.webp", "audio": "assets/audio/page02.mp3"}, {"title": "Trapped at the Red Sea", "text": "The Israelites became terrified. The sea was in front of them, and Pharaoh’s army was closing in from behind.", "dialogues": ["Moses! The Egyptian army is coming!", "We are trapped!"], "fx": "tension", "image": "assets/images/scene03.webp", "audio": "assets/audio/page03.mp3"}, {"title": "Trust God", "text": "Moses told the people not to be afraid. He trusted that God would make a way for them.", "dialogues": ["Do not be afraid. Stand firm and see how the Lord will deliver you."], "fx": "resolve", "image": "assets/images/scene04.webp", "audio": "assets/audio/page04.mp3"}, {"title": "The Cloud Protects the Israelites", "text": "God placed a cloud between the Israelites and the Egyptian army, protecting His people through the night.", "dialogues": ["What is happening?"], "fx": "cloud", "image": "assets/images/scene05.webp", "audio": "assets/audio/page05.mp3"}, {"title": "Moses Raises His Staff", "text": "Then God told Moses to stretch out his hand over the sea. The wind became stronger, and the surface of the sea began to move.", "dialogues": [], "fx": "wind", "image": "assets/images/scene06.webp", "audio": "assets/audio/page06.mp3"}, {"title": "The Red Sea Parts", "text": "A powerful wind divided the sea, and dry ground appeared between the waters.", "dialogues": ["Look!", "Go! Move forward!"], "fx": "seaPart", "image": "assets/images/scene07.webp", "audio": "assets/audio/page07.mp3"}, {"title": "The Israelites Cross", "text": "The Israelites crossed the sea on dry ground, with walls of water standing on both sides.", "dialogues": ["Forward!"], "fx": "water", "image": "assets/images/scene08.webp", "audio": "assets/audio/page08.mp3"}, {"title": "Pharaoh’s Army Pursues", "text": "The Egyptian army followed them into the sea, but their chariots began to struggle.", "dialogues": ["We must get out of here!"], "fx": "hoovesFast", "image": "assets/images/scene09.webp", "audio": "assets/audio/page09.mp3"}, {"title": "The Sea Returns", "text": "When the Israelites were safely across, the waters returned.", "dialogues": [], "fx": "wave", "image": "assets/images/scene10.webp", "audio": "assets/audio/page10.mp3"}, {"title": "Freedom", "text": "The Israelites were finally safe. They had seen that even when there seemed to be no way forward, God had made a way.", "dialogues": [], "fx": "celebrate", "image": "assets/images/scene11.webp", "audio": "assets/audio/page11.mp3"}, {"title": "Faith • Courage • Freedom", "text": "The story of Moses and the Red Sea reminds us about courage, faith and trusting God during difficult times.", "dialogues": [], "fx": "finale", "image": "assets/images/scene12.webp", "audio": "assets/audio/page12.mp3"}];let i=0,story=false,busy=false,ctx=null;const $=id=>document.getElementById(id),pg=$("page"),im=$("img"),ttl=$("title"),tx=$("text"),qt=$("quotes"),ct=$("count"),bar=$("bar"),au=$("audio"),st=$("status"),dots=$("dots");
function render(){const p=pages[i];im.src=p.image;ttl.textContent=p.title;tx.textContent=p.text;qt.innerHTML="";p.dialogues.forEach(q=>{const s=document.createElement("span");s.className="quote";s.textContent="“"+q+"”";qt.appendChild(s)});ct.textContent=(i+1)+" / "+pages.length;bar.style.width=((i+1)/pages.length*100)+"%";$("prev").disabled=i===0;$("next").disabled=i===pages.length-1;[...dots.children].forEach((d,n)=>d.classList.toggle("on",n===i))}
pages.forEach((_,n)=>{let b=document.createElement("button");b.className="dot";b.onclick=()=>go(n,n>i?"n":"p");dots.appendChild(b)});
function audioCtx(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume()}
function noise(d=.15,f=1300,v=.12){audioCtx();let b=ctx.createBuffer(1,ctx.sampleRate*d,ctx.sampleRate),x=b.getChannelData(0);for(let k=0;k<x.length;k++)x[k]=(Math.random()*2-1)*(1-k/x.length);let s=ctx.createBufferSource(),q=ctx.createBiquadFilter(),g=ctx.createGain();q.type="bandpass";q.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(v,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);s.buffer=b;s.connect(q).connect(g).connect(ctx.destination);s.start()}
function tone(f,t=.2,v=.04){audioCtx();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(v,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+t);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+t+.02)}
function scene(){if(!$("fx").checked)return;const x=pages[i].fx;if(["wind","cloud","water","seaPart","wave"].includes(x))noise(x==="wave"?.55:.35,x==="wave"?500:850,x==="wave"?.12:.05);else if(["hooves","hoovesFast","tension"].includes(x)){tone(95,.12,.05);setTimeout(()=>tone(82,.12,.05),120)}else if(["resolve","celebrate","finale"].includes(x)){tone(440,.22,.03);setTimeout(()=>tone(590,.25,.03),160)}}
function readPage(continueStory=false){audioCtx();au.pause();au.src=pages[i].audio;au.load();scene();st.textContent=continueStory?"Reading full story…":"Reading page…";au.play().catch(()=>st.textContent="Tap Read Page again to allow audio.");au.onended=()=>{if(story&&i<pages.length-1)setTimeout(()=>go(i+1,"n",true),300);else{story=false;st.textContent="Audio finished."}}}
function go(n,d="n",cont=false){n=Math.max(0,Math.min(pages.length-1,n));if(n===i||busy)return;busy=true;au.pause();if(!cont)story=false;if($("flip").checked)noise(.12,1500,.10);pg.classList.add(d==="p"?"flipP":"flipN");setTimeout(()=>{i=n;render()},260);setTimeout(()=>{pg.classList.remove("flipP","flipN");busy=false;if(cont&&story)readPage(true);else if($("aut").checked)readPage(false)},570)}
$("read").onclick=()=>{story=false;readPage(false)};$("full").onclick=()=>{story=true;readPage(true)};$("stop").onclick=()=>{story=false;au.pause();st.textContent="Stopped."};$("prev").onclick=()=>go(i-1,"p");$("next").onclick=()=>go(i+1,"n");$("left").onclick=()=>go(i-1,"p");$("right").onclick=()=>go(i+1,"n");let sx=null;pg.addEventListener("touchstart",e=>sx=e.changedTouches[0].clientX,{passive:true});pg.addEventListener("touchend",e=>{if(sx==null)return;let d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>45)go(i+(d<0?1:-1),d<0?"n":"p")},{passive:true});render();
